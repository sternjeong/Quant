# Quant VM 최상위 진입점(80번 포트) — 관제 허브(hub/server.py, 127.0.0.1:8000)로 프록시.
# 실제 운영은 deploy/setup_gateway.sh가 이 사이트를 'IP 접속은 도메인으로 301' 규칙으로 덮어쓴다 —
# 이 파일은 도메인 없이 IP로 허브만 볼 때의 기본형이다(앱 카드는 HTTPS 하위 도메인 link 슬롯).
# 설치: deploy/PENDING_MANUAL_LOGIN_ACTIONS.md 4번 절차 참고 (sudo 필요, 이 자동화 계정은
# 설치를 대신 못 함).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
