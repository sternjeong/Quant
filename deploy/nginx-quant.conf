# [참고용 기본형] 도메인 없이 IP 80번으로 허브만 볼 때의 설정 — 로그인이 없다. 공개 VM 에서는 쓰지 말 것.
# 운영 VM 은 deploy/setup_gateway.sh 가 HTTPS 게이트웨이(허브 로그인 폼 + 세션 쿠키, 80번은 도메인으로 301)를 설치하며
# 이 사이트 파일을 덮어쓴다. 현재 구성은 deploy/DEPLOYMENT_ORACLE.md 13·14번 참고.
# Quant VM 최상위 진입점(80번 포트) — 관제 허브(hub/server.py, 127.0.0.1:8000)로 프록시.
# 실제 운영은 deploy/setup_gateway.sh가 이 사이트를 'IP 접속은 도메인으로 301' 규칙으로 덮어쓴다 —
# 이 파일은 도메인 없이 IP로 허브만 볼 때의 기본형이다(앱 카드는 HTTPS 하위 도메인 link 슬롯).
# 설치: deploy/PENDING_MANUAL_LOGIN_ACTIONS.md 4번 절차 참고 (sudo 필요, 이 자동화 계정은
# 설치를 대신 못 함).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
